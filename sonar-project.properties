# Analisi SonarQube (workflow "Analisi del codice"): backend Java e frontend React insieme.
sonar.projectKey=orditogram
sonar.projectName=Orditogram
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.exclusions=frontend/src/**/*.test.js,frontend/src/**/*.test.jsx
sonar.test.inclusions=backend/src/test/java/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx

sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.libraries=backend/target/dependency/*.jar
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# il risultato del quality gate decide l'esito del passo
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
