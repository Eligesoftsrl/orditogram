# Orditogram: l'applicazione React e, sullo stesso indirizzo, il backend (nessun CORS da configurare)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # documenti fino a 200 MB per caricamento, come nel backend
    client_max_body_size 200m;

    # sicurezza di base (ripetuta nelle location che aggiungono intestazioni: in nginx non si ereditano)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ ^/(api|oauth2|login/oauth2|actuator)(/|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # i file con l'hash nel nome non cambiano mai
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
