# Integrazione continua: a ogni modifica compila e prova backend e frontend;
# con un tag "v1.2.3" pubblica anche le immagini Docker su GitHub Container Registry.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compila e prova (unitari + integrazione con motore e H2)
        run: mvn -B verify
      - name: Rapporto dei test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapporto-test-backend
          path: backend/target/surefire-reports

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  immagini:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Accesso al registry (solo per i tag di versione)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Versione
        id: v
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Immagine backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/${{ github.repository_owner }}/orditogram-backend:${{ steps.v.outputs.tag }}
      - name: Immagine frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/${{ github.repository_owner }}/orditogram-frontend:${{ steps.v.outputs.tag }}
